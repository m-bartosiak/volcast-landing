name: Publish scheduled blog posts

on:
  schedule:
    # Runs every Tuesday at 09:00 UTC (11:00 CEST)
    - cron: '0 9 * * 2'
  workflow_dispatch: # Manual trigger for testing

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write   # opening the PR and enabling auto-merge

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Push wykonany poświadczeniami GITHUB_TOKEN nie startuje workflowów,
          # więc seo-guard — wymagany check na main — nigdy nie zaraportuje na
          # gałęzi otwartej przez ten job, a auto-merge będzie czekał bez końca.
          # PAT sprawia, że push jest przypisany człowiekowi i triggery działają.
          #
          # Fallback jest celowy: bez sekretu workflow zachowuje się dokładnie
          # jak dotąd (PR wstaje, tylko trzeba go zmergować ręcznie) zamiast
          # wywalić się na pustym tokenie.
          token: ${{ secrets.PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check schedule and publish posts
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          SCHEDULE="src/content/schedule.json"

          if [ ! -f "$SCHEDULE" ]; then
            echo "No schedule file found"
            exit 0
          fi

          # Find files due today OR earlier — catch-up so a skipped scheduled run
          # (GitHub silently drops some) doesn't strand a batch forever.
          FILES=$(jq -r --arg today "$TODAY" '.[] | select(.date <= $today) | .files[]' "$SCHEDULE")

          if [ -z "$FILES" ]; then
            echo "No posts scheduled for $TODAY"
            exit 0
          fi

          CHANGED=false

          for FILE in $FILES; do
            FILEPATH="src/content/blog/$FILE"
            if [ -f "$FILEPATH" ]; then
              # Replace draft: true with draft: false
              if grep -q "^draft: true" "$FILEPATH"; then
                sed -i 's/^draft: true/draft: false/' "$FILEPATH"
                echo "Published: $FILE"
                CHANGED=true
              else
                echo "Already published: $FILE"
              fi
            else
              echo "File not found: $FILE"
            fi
          done

          # Remove processed entries (today and earlier); keep only future ones
          if [ "$CHANGED" = true ]; then
            jq --arg today "$TODAY" '[.[] | select(.date > $today)]' "$SCHEDULE" > tmp.json
            mv tmp.json "$SCHEDULE"
          fi

          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
        id: publish

      # main requires a pull request, so this can no longer push to it. It opens
      # one instead and turns on auto-merge: GitHub lands it as soon as Vercel's
      # build goes green, which keeps publishing unattended while still routing
      # it through the same gate as everything else.
      - name: Open a pull request and let it merge itself
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="content/publish-$DATE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "📝 Publish scheduled blog posts for $DATE"
          # A retry on the same day rebuilds the same content, so replacing the
          # branch is safe and keeps one PR per publication date.
          git push --force-with-lease -u origin "$BRANCH"

          if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr create --base main --head "$BRANCH" \
              --title "📝 Publish scheduled blog posts for $DATE" \
              --body "Scheduled publication: \`draft: true\` → \`draft: false\` for the posts due on or before $DATE in \`src/content/schedule.json\`, which is updated in the same commit.

          Opened by the \`publish-blog\` workflow. Auto-merge is on, so this lands by itself once Vercel reports a green build. No content is written here — every post in it was written and scheduled earlier."
          fi

          gh pr merge --auto --merge "$BRANCH"
