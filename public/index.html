  <!-- Ta strona to shim przekierowujący po języku; jej treść jest identyczna z /en/.
       Kanonikalizujemy do /en/, bo tam wskazuje już x-default i sitemapa — inaczej
       / i /en/ konkurują ze sobą jako dwie osobne strony z tym samym tytułem. -->
  <link rel="canonical" href="https://volcast.app/en/">
  <script>
    (function() {
      var LOCALE_MAP = {
        'pl': 'pl', 'en': 'en', 'de': 'de', 'nl': 'nl',
        'es': 'es', 'fr': 'fr', 'uk': 'uk', 'pt': 'pt',
        'ro': 'ro', 'cs': 'cs', 'sk': 'sk', 'it': 'it'
      };

      // 1. Check localStorage preference
      var saved = localStorage.getItem('volcast-lang');
      if (saved && (LOCALE_MAP[saved] || saved === 'pt-br')) {
        window.location.replace('/' + saved + '/' + window.location.hash);
        return;
      }

      // 2. Detect browser language
      var langs = navigator.languages || [navigator.language || 'en'];
      for (var i = 0; i < langs.length; i++) {
        var tag = langs[i].toLowerCase();

        // pt-BR special case
        if (tag === 'pt-br' || tag.startsWith('pt-br')) {
          localStorage.setItem('volcast-lang', 'pt-br');
          window.location.replace('/pt-br/' + window.location.hash);
          return;
        }

        // Match primary subtag
        var primary = tag.split('-')[0];
        if (LOCALE_MAP[primary]) {
          localStorage.setItem('volcast-lang', primary);
          window.location.replace('/' + primary + '/' + window.location.hash);
          return;
        }
      }

      // 3. Default to English
      localStorage.setItem('volcast-lang', 'en');
      window.location.replace('/en/' + window.location.hash);
    })();
  </script>
